name = "caminhodoperdao"
compatibility_date = "2024-11-01"
pages_build_output_dir = "build"

## Durable Object: WaCounter

## MAX_REGISTRATIONS_STAFF = 999999: staff sem teto. O balde do staff é separado do
## dos peregrinos, então isso não abre vagas extras de peregrino nem camas no mosteiro.
##
## ADMIN_DEFAULT_PASSWORD foi REMOVIDO daqui de propósito: senha em arquivo
## versionado é senha pública — essa vazou no histórico do git e 9 dos 11 admins
## ainda a usavam. Não existe mais senha padrão: admin novo nasce com senha
## aleatória (create.ts) e é obrigado a trocá-la no primeiro acesso. Para
## recriar o super admin numa base zerada, defina ADMIN_DEFAULT_PASSWORD como
## secret do Pages (wrangler pages secret put), nunca como var aqui.
##
## RESEND_FROM: remetente dos e-mails. Não existe caixa postal com esse nome —
## o domínio verificado no Resend (03/08/2026, DKIM + SPF) autoriza qualquer
## endereço @caminhodoperdao.com.br, e o valor só viaja no campo "from" do envio.
## É público de propósito: quem recebe o e-mail lê esse endereço. A credencial
## do Resend (RESEND_API_KEY) é secret do Pages e NUNCA entra aqui.
## EVENT_YEAR: ano da edição em andamento, gravado em registrations.event_year.
## TROCAR ANTES DE ABRIR A INSCRIÇÃO DO ANO SEGUINTE. A coluna tem DEFAULT 2026
## (migration 025) só para não existir NULL — num índice único de várias colunas
## o SQLite não aplica a unicidade na linha em que alguma coluna é NULL, e o CPF
## escaparia da regra "1 inscrição por edição". Se esta env ficar desatualizada,
## a inscrição de 2027 nasce marcada como 2026 sem erro nenhum.
##
## Decidido em 03/08/2026: o destinatário NÃO deve conseguir responder. Não
## existe reply-to em nenhum e-mail, e o "Enable Receiving" fica desligado no
## Resend — resposta a este endereço volta com erro, de propósito. Como o botão
## "Responder" existe em qualquer app de e-mail, todo corpo de mensagem precisa
## dizer que não se responde e oferecer o WhatsApp como canal de contato.
[env.production]
vars = { SERVICE_VERSION = "0.1.0", SITE_URL = "https://caminhodoperdao.com.br", REACT_APP_AMPLITUDE_KEY = "fa735008fc76815c093b0be0df103334", REACT_APP_AMPLITUDE_ENABLED = "true", REACT_APP_AMPLITUDE_SESSION_REPLAY = "false", REACT_APP_AMPLITUDE_DEBUG = "false", REACT_APP_GALLERY_API_URL = "/api/gallery", GITHUB_GALLERY_REPO = "iBeeTech/caminhodoperdao-gallery", GITHUB_GALLERY_BRANCH = "main", GALLERY_YEARS = "2026,2025", ADMIN_DEFAULT_EMAIL = "cassiotakarada7@gmail.com", ADMIN_JWT_TTL_SECONDS = "43200", MAX_REGISTRATIONS = "500", MAX_REGISTRATIONS_SLEEP = "80", MAX_REGISTRATIONS_STAFF = "999999", RESEND_FROM = "Caminho do Perdão <nao-responda@caminhodoperdao.com.br>", EVENT_YEAR = "2026" }



[[env.production.d1_databases]]
binding = "DB"
database_name = "caminhodoperdao-db"
database_id = "784a0aec-8695-48d4-8ede-df680660735e"

## Áudios dos testemunhos (graças e milagres) gravados pelo público.
## KV (plano gratuito, sem cartão) — guarda o áudio para a moderação ouvir.
[[env.production.kv_namespaces]]
binding = "TESTIMONY_AUDIO"
id = "c1cd94516ced4c65b0addd643bff355e"

## Workers AI: transcrição dos áudios de testemunho (Whisper).
[env.production.ai]
binding = "AI"


[env.preview]
vars = { SERVICE_VERSION = "0.1.0", SITE_URL = "http://localhost:3000", REACT_APP_AMPLITUDE_KEY = "fa735008fc76815c093b0be0df103334", REACT_APP_AMPLITUDE_ENABLED = "true", REACT_APP_AMPLITUDE_SESSION_REPLAY = "false", REACT_APP_AMPLITUDE_DEBUG = "false", REACT_APP_GALLERY_API_URL = "/api/gallery", GITHUB_GALLERY_REPO = "iBeeTech/caminhodoperdao-gallery", GITHUB_GALLERY_BRANCH = "main", GALLERY_YEARS = "2026,2025", ADMIN_JWT_SECRET = "CHANGE_ME_STRONG_SECRET", ADMIN_DEFAULT_EMAIL = "cassiotakarada7@gmail.com", ADMIN_DEFAULT_PASSWORD = "mudarsenha123", ADMIN_JWT_TTL_SECONDS = "43200", MAX_REGISTRATIONS = "500", MAX_REGISTRATIONS_SLEEP = "80", MAX_REGISTRATIONS_STAFF = "999999", RESEND_FROM = "Caminho do Perdão <nao-responda@caminhodoperdao.com.br>", EVENT_YEAR = "2026" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "caminhodoperdao-db"
database_id = "784a0aec-8695-48d4-8ede-df680660735e"

[[env.preview.kv_namespaces]]
binding = "TESTIMONY_AUDIO"
id = "c1cd94516ced4c65b0addd643bff355e"

[env.preview.ai]
